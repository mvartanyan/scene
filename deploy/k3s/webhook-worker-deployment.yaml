apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-webhook-worker
  namespace: scene
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: webhook-worker
    app.kubernetes.io/part-of: scene
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scene
      app.kubernetes.io/component: webhook-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene
        app.kubernetes.io/component: webhook-worker
        app.kubernetes.io/part-of: scene
    spec:
      serviceAccountName: scene-webhook-worker
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: scene-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhook-worker
          image: scene-app-image
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.services.webhook_worker
          envFrom:
            - configMapRef:
                name: scene-runtime
            - secretRef:
                name: scene-app-aws
            - secretRef:
                name: scene-webhook-auth
          env:
            - name: SCENE_PROCESS_ROLE
              value: webhook-worker
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - kill -0 1
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os; from datetime import datetime, timedelta, timezone;
                  from app.services.storage import get_repository; lease =
                  get_repository().webhook_worker_status() or {}; now =
                  datetime.now(timezone.utc); assert
                  str(lease.get("owner", "")).startswith(os.environ["HOSTNAME"] + "-"),
                  lease; assert lease.get("enabled") is True, lease; assert
                  lease.get("configured_ok") is True, lease; assert
                  datetime.fromisoformat(str(lease["heartbeat_at"]).replace("Z", "+00:00"))
                  > now - timedelta(seconds=15), lease; assert
                  datetime.fromisoformat(str(lease["expires_at"]).replace("Z", "+00:00"))
                  > now, lease
            failureThreshold: 2
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
