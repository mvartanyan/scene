apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: scene-https-redirect
  namespace: scene
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: scene-staging-auth
  namespace: scene
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: ingress
spec:
  basicAuth:
    secret: scene-ingress-basic-auth
    # BasicAuth owns Authorization at staging. API clients send the separate
    # X-SCENE-API-Token header, and Basic credentials are never forwarded.
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scene-spm-api
  namespace: scene
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # This route bypasses only the temporary human BasicAuth gate. The
      # candidate, launch, and result handlers enforce SCENE Bearer auth.
      match: '(Host(`scene.spherical.horse`) || Host(`scene.135.181.140.68.sslip.io`)) && (Path(`/healthz`) || Path(`/api/check-candidates`) || PathRegexp(`^/api/batches/[^/]+/comparison-runs$`) || PathRegexp(`^/api/runs/[^/]+/result$`))'
      priority: 1000
      services:
        - name: scene
          port: 80
  tls:
    secretName: scene-staging-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scene
  namespace: scene
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: scene-scene-https-redirect@kubernetescrd,scene-scene-staging-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: scene.spherical.horse
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scene
                port:
                  name: http
    - host: scene.135.181.140.68.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scene
                port:
                  name: http
  tls:
    - hosts:
        - scene.spherical.horse
        - scene.135.181.140.68.sslip.io
      secretName: scene-staging-tls
